<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotline - AI Recipe Assistant</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #dc2626;
            --secondary-color: #b91c1c;
            --accent-color: #ef4444;
            --dark-color: #1f2937;
            --light-color: #fef2f2;
            --border-color: #e5e7eb;
            --success-color: #f59e0b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            height: 100vh;
            overflow: hidden;
            color: var(--dark-color);
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            margin: 0;
            background: white;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
            box-shadow: 0 2px 10px rgba(220, 38, 38, 0.2);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .header .subtitle {
            margin: 0;
            opacity: 0.95;
            font-size: 0.9rem;
            font-weight: 300;
        }
        
        .footer-brand {
            text-align: center;
            padding: 0.5rem;
            font-size: 0.85rem;
            color: #6b7280;
            background: #f9fafb;
            border-top: 1px solid var(--border-color);
        }
        
        .footer-brand strong {
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: white;
        }
        
        .welcome-message {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--dark-color);
        }
        
        .welcome-icon {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .welcome-message h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--dark-color);
        }
        
        .welcome-message p {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .message {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.3rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .message.user .message-icon {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }
        
        .message.assistant .message-icon {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }
        
        .message-content {
            margin: 0 1rem;
            max-width: calc(100% - 80px);
            background: white;
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border: 1px solid var(--accent-color);
        }
        
        .message-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 0.75rem;
            border: 2px solid var(--border-color);
        }
        
        .message-text {
            line-height: 1.8;
            white-space: pre-wrap;
        }
        
        .ingredients-detected {
            background: #fff7ed;
            border-left: 4px solid var(--success-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .ingredients-detected strong {
            display: block;
            color: var(--dark-color);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .recipes {
            background: linear-gradient(135deg, #fef2f2, #fcf2f2);
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 0.5rem;
        }
        
        .recipe-card {
            background: white;
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .recipe-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.1);
        }
        
        .recipe-card:last-child {
            margin-bottom: 0;
        }
        
        .recipe-card h4 {
            color: var(--primary-color);
            font-size: 1.3rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .recipe-card h4 i {
            font-size: 1.2rem;
        }
        
        .recipe-card .description {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            font-style: italic;
        }
        
        .recipe-detail {
            margin-bottom: 0.75rem;
            display: flex;
            align-items: start;
            gap: 0.75rem;
        }
        
        .recipe-detail i {
            color: var(--primary-color);
            margin-top: 0.2rem;
            font-size: 1rem;
        }
        
        .recipe-detail strong {
            color: var(--dark-color);
            font-weight: 600;
            margin-right: 0.5rem;
        }
        
        .recipe-detail span {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .recipe-instructions {
            background: #f9fafb;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .recipe-instructions h5 {
            color: var(--primary-color);
            font-size: 1rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        
        .recipe-instructions ol {
            margin: 0;
            padding-left: 1.5rem;
        }
        
        .recipe-instructions li {
            color: #6b7280;
            font-size: 0.9rem;
            line-height: 1.8;
            margin-bottom: 0.5rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
            border-width: 0.3rem;
            color: var(--primary-color);
        }
        
        .chat-input-container {
            border-top: 2px solid var(--border-color);
            background: white;
            padding: 1.5rem;
        }
        
        .input-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .image-upload-btn {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 55px;
            height: 55px;
        }
        
        .image-upload-btn input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .image-upload-btn label {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.3rem;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }
        
        .image-upload-btn label:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.3);
        }
        
        .image-upload-btn label:active {
            transform: scale(0.95);
        }
        
        .image-preview {
            display: none;
            max-width: 80px;
            max-height: 80px;
            width: auto;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 0.5rem;
            border: 2px solid var(--border-color);
        }
        
        .image-preview.active {
            display: block;
        }
        
        .upload-status {
            color: var(--primary-color);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            font-weight: 500;
        }
        
        .error-message {
            background: #fee2e2;
            border-left: 4px solid var(--primary-color);
            color: #991b1b;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }
        
        .error-message.active {
            display: block;
        }
        
        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }
        
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 1rem 1rem;
            }
            
            .logo-img {
                width: 40px;
                height: 40px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .header .subtitle {
                font-size: 0.85rem;
            }
            
            .logo-container {
                gap: 0.5rem;
                margin-bottom: 0.25rem;
            }
            
            .message-content {
                max-width: calc(100% - 80px);
                padding: 1rem;
            }
            
            .message-image {
                width: 100px;
                height: 100px;
            }
            
            .chat-container {
                padding: 1rem;
            }
            
            .welcome-message {
                padding: 2rem 1rem;
            }
            
            .welcome-icon {
                font-size: 3.5rem;
                margin-bottom: 1rem;
            }
            
            .welcome-message h2 {
                font-size: 1.5rem;
            }
            
            .welcome-message p {
                font-size: 0.9rem;
            }
            
            .message-icon {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
            
            .chat-input-container {
                padding: 1rem;
            }
            
            .image-upload-btn {
                width: 50px;
                height: 50px;
            }
            
            .recipe-card {
                padding: 1rem;
            }
            
            .recipe-card h4 {
                font-size: 1.1rem;
            }
            
            .recipe-detail {
                font-size: 0.85rem;
            }
            
            .ingredients-detected {
                padding: 0.75rem;
            }
        }
        
        @media (max-width: 480px) {
            .header {
                padding: 0.75rem 0.5rem;
            }
            
            .logo-img {
                width: 35px;
                height: 35px;
            }
            
            .header h1 {
                font-size: 1.25rem;
            }
            
            .header .subtitle {
                font-size: 0.75rem;
            }
            
            .message-content {
                max-width: calc(100% - 70px);
                padding: 0.75rem;
            }
            
            .message-image {
                width: 120px;
                height: 120px;
            }
            
            .chat-container {
                padding: 0.75rem;
            }
            
            .welcome-message {
                padding: 1.5rem 0.5rem;
            }
            
            .welcome-icon {
                font-size: 3rem;
            }
            
            .welcome-message h2 {
                font-size: 1.25rem;
            }
            
            .welcome-message p {
                font-size: 0.85rem;
            }
            
            .message-icon {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
            
            .recipe-card {
                padding: 0.75rem;
            }
            
            .recipe-card h4 {
                font-size: 1rem;
            }
            
            .recipes {
                padding: 1rem;
            }
            
            .image-upload-btn {
                width: 45px;
                height: 45px;
            }
            
            .image-upload-btn label {
                font-size: 1.1rem;
            }
            
            .footer-brand {
                font-size: 0.75rem;
                padding: 0.75rem 0.5rem;
            }
        }
        
        @media (min-width: 768px) {
            .message-image {
                width: 120px;
                height: 120px;
            }
        }
        
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <img src="https://media.licdn.com/dms/image/v2/D560BAQFZl_bYEgQLnw/company-logo_200_200/B56ZjxhOTJHcAY-/0/1756398676109/cookhotline_logo?e=1763596800&v=beta&t=aGhmfmqVYbDyFTHYS7mLjtl4TWP5yGjI58Vq9Gqdwz4" alt="Hotline Logo" class="logo-img" />
                <h1>Hotline</h1>
            </div>
            <p class="subtitle">AI-Powered Recipe Assistant</p>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message" id="welcomeMessage">
                <i class="fas fa-utensils welcome-icon"></i>
                <h2>Welcome to Hotline!</h2>
                <p>Upload an image of your ingredients below to get personalized recipe suggestions powered by AI.</p>
            </div>
            
            <div class="loading" id="loadingIndicator">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Analyzing ingredients and generating recipes...</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-brand">
            <strong>Hotline</strong> - Developed by <strong>Eduardo Varela for technical Interview</strong>
                    </div>

        <!-- Chat Input -->
        <div class="chat-input-container">
            <div class="upload-status" id="uploadStatus"></div>
            <div class="error-message" id="errorMessage"></div>
            
            <div class="input-group">
                <div class="image-upload-btn">
                    <input type="file" id="imageInput" accept="image/*" />
                    <label for="imageInput">
                        <i class="fas fa-camera"></i>
                    </label>
                </div>
                
                <div style="flex: 1; position: relative;">
                    <input type="text" class="form-control" id="imagePreview" 
                           placeholder="Upload an image to get started..." 
                           disabled style="cursor: pointer;" />
                    <img id="imagePreviewImg" class="image-preview" alt="Preview" />
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const imageInput = document.getElementById('imageInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const errorMessage = document.getElementById('errorMessage');
        const imagePreview = document.getElementById('imagePreview');
        const imagePreviewImg = document.getElementById('imagePreviewImg');
        
        imageInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            
            if (!file) {
                return;
            }
            
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Please select a valid image file');
                return;
            }
            
            // Validate file size (max 16MB)
            if (file.size > 16 * 1024 * 1024) {
                showError('Image size must be less than 16MB');
                return;
            }
            
            // Show image preview and create user message
            const reader = new FileReader();
            reader.onload = function(event) {
                const imageData = event.target.result;
                
                // Show preview in input
                imagePreviewImg.src = imageData;
                imagePreviewImg.classList.add('active');
                imagePreview.value = file.name;
                
                // Hide welcome message
                welcomeMessage.style.display = 'none';
                
                // Show user's uploaded image in chat
                const userMessage = createMessage('user', '', imageData);
                chatContainer.insertBefore(userMessage, loadingIndicator);
            };
            reader.readAsDataURL(file);
            
            // Show loading
            loadingIndicator.classList.add('active');
            uploadStatus.textContent = 'Processing image...';
            hideError();
            
            // Scroll to bottom
            scrollToBottom();
            
            try {
                // Create form data
                const formData = new FormData();
                formData.append('image', file);
                
                // Send to backend
                const response = await fetch('/api/analyze-ingredients', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to process image');
                }
                
                // Hide loading
                loadingIndicator.classList.remove('active');
                uploadStatus.textContent = '';
                
                // Show assistant response
                const assistantMessage = createRecipeMessage(data);
                chatContainer.insertBefore(assistantMessage, loadingIndicator);
                
                // Reset input
                imageInput.value = '';
                imagePreview.value = '';
                imagePreviewImg.src = '';
                imagePreviewImg.classList.remove('active');
                
                // Scroll to bottom
                scrollToBottom();
                
            } catch (error) {
                console.error('Error:', error);
                loadingIndicator.classList.remove('active');
                uploadStatus.textContent = '';
                showError(error.message || 'Failed to process image. Please try again.');
                
                // Remove user message
                const userMessages = chatContainer.querySelectorAll('.message.user');
                if (userMessages.length > 0) {
                    userMessages[userMessages.length - 1].remove();
                }
            }
        });
        
        function createMessage(type, text, imageSrc = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const icon = document.createElement('div');
            icon.className = 'message-icon';
            icon.innerHTML = type === 'user' 
                ? '<i class="fas fa-user"></i>' 
                : '<i class="fas fa-robot"></i>';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            if (imageSrc) {
                const img = document.createElement('img');
                img.src = imageSrc;
                img.className = 'message-image';
                content.appendChild(img);
            }
            
            if (text) {
                const textDiv = document.createElement('div');
                textDiv.className = 'message-text';
                textDiv.textContent = text;
                content.appendChild(textDiv);
            }
            
            messageDiv.appendChild(icon);
            messageDiv.appendChild(content);
            
            return messageDiv;
        }
        
        function createRecipeMessage(data) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            const icon = document.createElement('div');
            icon.className = 'message-icon';
            icon.innerHTML = '<i class="fas fa-robot"></i>';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            // Ingredients detected
            if (data.ingredients_detected) {
                const ingredientsDiv = document.createElement('div');
                ingredientsDiv.className = 'ingredients-detected';
                ingredientsDiv.innerHTML = `<strong>🍽️ Ingredients Detected:</strong>${formatIngredients(data.ingredients_detected)}`;
                content.appendChild(ingredientsDiv);
            }
            
            // Recipes
            if (data.recipes) {
                const recipesDiv = document.createElement('div');
                recipesDiv.className = 'recipes';
                recipesDiv.innerHTML = formatRecipes(data.recipes);
                content.appendChild(recipesDiv);
            }
            
            messageDiv.appendChild(icon);
            messageDiv.appendChild(content);
            
            return messageDiv;
        }
        
        function formatIngredients(text) {
            // Clean up the ingredients text and make it look nicer
            let formatted = text.trim();
            // Replace bullet points and clean up
            formatted = formatted.replace(/^- /gm, '• ');
            formatted = formatted.replace(/\n/g, '<br>');
            return `<div style="margin-top: 0.5rem; color: #6b7280; font-size: 0.9rem; line-height: 1.8;">${formatted}</div>`;
        }
        
        function formatRecipes(text) {
            // Parse the recipes text and format it nicely
            const recipes = text.split(/\n### /).filter(r => r.trim());
            
            return recipes.map((recipe, index) => {
                const lines = recipe.split('\n');
                const title = lines[0].replace(/^###? ?/, '').trim();
                
                let description = '';
                let ingredients = '';
                let time = '';
                let difficulty = '';
                let instructions = [];
                let currentSection = null;
                let currentText = [];
                
                // Helper function to save current section
                function saveSection(section, data) {
                    if (section === 'description') description = data;
                    else if (section === 'ingredients') ingredients = data;
                    else if (section === 'time') time = data;
                    else if (section === 'difficulty') difficulty = data;
                }
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('**Description:**')) {
                        if (currentSection && currentText.length > 0) {
                            saveSection(currentSection, currentText.join(' '));
                        }
                        currentSection = 'description';
                        currentText = [];
                        const text = line.replace(/^\*\*Description:\*\* ?/, '');
                        if (text) currentText.push(text);
                    } else if (line.startsWith('**Key Ingredients Used:**')) {
                        if (currentSection && currentText.length > 0) {
                            saveSection(currentSection, currentText.join(' '));
                        }
                        currentSection = 'ingredients';
                        currentText = [];
                        const text = line.replace(/^\*\*Key Ingredients Used:\*\* ?/, '');
                        if (text) currentText.push(text);
                    } else if (line.startsWith('**Estimated Preparation Time:**')) {
                        if (currentSection && currentText.length > 0) {
                            saveSection(currentSection, currentText.join(' '));
                        }
                        currentSection = 'time';
                        currentText = [];
                        const text = line.replace(/^\*\*Estimated Preparation Time:\*\* ?/, '');
                        if (text) currentText.push(text);
                    } else if (line.startsWith('**Difficulty Level:**')) {
                        if (currentSection && currentText.length > 0) {
                            saveSection(currentSection, currentText.join(' '));
                        }
                        currentSection = 'difficulty';
                        currentText = [];
                        const text = line.replace(/^\*\*Difficulty Level:\*\* ?/, '');
                        if (text) currentText.push(text);
                    } else if (line.startsWith('**Instructions:**') || line === '**Instructions:**') {
                        if (currentSection && currentText.length > 0) {
                            saveSection(currentSection, currentText.join(' '));
                        }
                        currentSection = null;
                        i++;
                        while (i < lines.length && lines[i].trim()) {
                            const instruction = lines[i].replace(/^\d+\.\s*/, '').trim();
                            if (instruction) instructions.push(instruction);
                            i++;
                        }
                        break;
                    } else if (line && currentSection && !line.startsWith('**')) {
                        // Continuation of current section
                        currentText.push(line);
                    } else if (line && currentSection) {
                        // End of current section
                        if (currentText.length > 0) {
                            saveSection(currentSection, currentText.join(' '));
                        }
                        currentSection = null;
                        currentText = [];
                    }
                }
                
                // Save last section
                if (currentSection && currentText.length > 0) {
                    saveSection(currentSection, currentText.join(' '));
                }
                
                // Fallback: if nothing parsed, show raw text
                if (!description && !ingredients && !time && !difficulty && instructions.length === 0) {
                    const rawText = lines.slice(1).join('\n');
                    return `
                        <div class="recipe-card">
                            <h4><i class="fas fa-utensils"></i> ${title}</h4>
                            <div class="description" style="white-space: pre-wrap;">${rawText}</div>
                        </div>
                    `;
                }
                
                return `
                    <div class="recipe-card">
                        <h4><i class="fas fa-utensils"></i> ${title}</h4>
                        ${description ? `<div class="description">${description}</div>` : ''}
                        <div class="recipe-details">
                            ${ingredients ? `<div class="recipe-detail"><i class="fas fa-list-ul"></i><strong>Ingredients:</strong> <span>${ingredients}</span></div>` : ''}
                            ${time ? `<div class="recipe-detail"><i class="fas fa-clock"></i><strong>Time:</strong> <span>${time}</span></div>` : ''}
                            ${difficulty ? `<div class="recipe-detail"><i class="fas fa-signal"></i><strong>Difficulty:</strong> <span>${difficulty}</span></div>` : ''}
                        </div>
                        ${instructions.length > 0 ? `
                            <div class="recipe-instructions">
                                <h5><i class="fas fa-list-ol"></i> Instructions</h5>
                                <ol>
                                    ${instructions.map(inst => `<li>${inst}</li>`).join('')}
                                </ol>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }
        
        function hideError() {
            errorMessage.classList.remove('active');
        }
        
        // Click on input to trigger file selection
        imagePreview.addEventListener('click', function() {
            imageInput.click();
        });
    </script>
</body>
</html>
